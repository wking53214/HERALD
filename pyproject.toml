[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herald"
version = "0.3.0"
description = "Evidence-preserving natural-language interpretation layer for extracting, binding, validating, and handing off candidate claims"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: lets HERALD's confidence-gate verdicts be expressed as CNS gate
# results (herald/cns_connector.py). HERALD imports nothing from CNS unless
# that module is used. Pinned to CNS tag v2.2.0.
cns = [
    "cns @ git+https://github.com/wking53214/CNS.git@v2.3.0",
]

[tool.setuptools.packages.find]
# Flat layout with two top-level directories (herald/ and Tests/). Without
# this, setuptools refuses to guess and `pip install -e .` fails with
# "Multiple top-level packages discovered" (measured 2026-09-07).
include = ["herald*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.ruff]
line-length = 100
